<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        
    h1 {text-align : center;}
    .disp {width: 205px; height: 40px; margin-top: 3px;display: block;}
    .disp { font-family:"Oxanium", sans-serif; font-size: 22pt; text-align:right;}
    input[type=button] {width:50px; height:50px; text-align: center; vertical-align:middle; margin-top:5px;}
    #calc {width: 220px; margin-left : auto; margin-right: auto;}
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function() {
            $('.num').click(function() {
                let cur = $('#disp2').val();
                let n = $(this).val();
                $('#disp2').val(cur + n);
            });

            $('.op').click(function() {
                let cur = $('#disp2').val();
                let opt = $(this).val();

                if (cur === "") return; 

                if (opt !== "=") {
                    if (/[+\-*/]$/.test(cur)) {
                        $('#disp2').val(cur.slice(0, -1) + opt);
                    } else {
                        $('#disp2').val(cur + opt);
                    }
                } else {
                    try {
                        $('#disp1').val(cur + " ="); 
                        
                        let tokens = cur.replace(/^-/, "0-").match(/\d+(\.\d+)?|[+\-*/]/g);
                        let stack = [];
                        for (let i = 0; i < tokens.length; i++) {
                            if (tokens[i] === "*" || tokens[i] === "/") {
                                let prev = parseFloat(stack.pop());
                                let next = parseFloat(tokens[++i]);
                                if (tokens[i - 1] === "/" && next === 0) throw new Error();
                                stack.push(tokens[i - 1] === "*" ? prev * next : prev / next);
                            } else {
                                stack.push(tokens[i]);
                            }
                        }
                        let res = parseFloat(stack[0]);
                        for (let i = 1; i < stack.length; i += 2) {
                            let next = parseFloat(stack[i + 1]);
                            res = stack[i] === "+" ? res + next : res - next;
                        }
                        $('#disp2').val(Number.isNaN(res) ? "Error" : res);
                    } catch (e) {
                        $('#disp2').val("Error");
                    }
                }
            });

            $('#clear').click(function() {
                $('#disp1').val("");
                $('#disp2').val("");
            });
        });
    </script>
</head>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <input type="text" class="disp" id="disp1" readonly>
        <input type="text" class="disp" id="disp2" readonly>

        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>

        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>

        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>

        <input type="button" id="clear" value="C">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/"><br>
    </div>
</body>
</html>
