<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표</title>
    <style>
        h1 { color: brown; }
        .c1 { background-color: #e6f2ff; }
        #n1 { background-color: pink; }
        table th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>시간표</h1>
    <table border="1">
        <thead>
            <tr>
                <th>시간</th>
                <th>월요일</th>
                <th>화요일</th>
                <th>수요일</th>
                <th>목요일</th>
                <th>금요일</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>9시</td>
                <td class="c1" rowspan="3">컴퓨팅 사고</td>
                <td class="c1" rowspan="3">웹프로그래밍</td>
                <td rowspan="3">글로컬 영어</td>
                <td rowspan="8">공강</td>
                <td rowspan="4">공강</td>
            </tr>
            <tr>
                <td>10시</td>
            </tr>
            <tr>
                <td>11시</td>
            </tr>
            <tr>
                <td>12시</td>
                <td rowspan="2">종교와 인생</td>
                <td class="c1" rowspan="3">기계학습</td>
                <td rowspan="5">공강</td>
            </tr>
            <tr>
                <td>13시</td>
                <td rowspan="3">미적분학</td>
            </tr>
            <tr>
                <td>14시</td>
                <td class="c1" rowspan="3">인공지능개론</td>
            </tr>
            <tr>
                <td>15시</td>
                <td>공강</td>
            </tr>
            <tr>
                <td>16시</td>
                <td id="n1">채플</td>
                <td>공강</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
