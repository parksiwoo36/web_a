<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 실습</title>
</head>
<script>
    let number = prompt('숫자를 입력하세요.');
    let n = 1;

    while(n <= number) {
        document.write(n + "<br>");
        n++;
    }

    for(num = 1; num <= number; num++) {
        document.write(num + "<br>");
    }
    let sum = 0;
    let i = 0;
    while(i <=100) {
        if ((i % 2) == 0)
        sum = sum + i
        i++
    }
    document.write(sum);
    k = 0;
    for(e =0; e<=100; e++) {
        if(e % 2 != 0) continue;
        k = k + e;
    }
    documnet.write(k + "<br>");
</script>
<body>
    <h1>반복문</h1>
</body>
</html>
