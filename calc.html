<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .calculator {
            width: 300px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        #display {
            width: 100%;
            height: 60px;
            border: none;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 16px;
            padding: 0 15px;
            font-size: 28px;
            text-align: right;
            color: #222;
            box-sizing: border-box;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            background: #f1f3f5;
            color: #333;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #e9ecef;
        }

        button:active {
            background: #dee2e6;
        }

        .operator {
            background: #e7f5ff;
            color: #1c7ed6;
            font-weight: 600;
        }

        .operator:hover {
            background: #d0ebff;
        }

        .clear {
            background: #fff5f5;
            color: #f03e3e;
            font-weight: 600;
        }

        .clear:hover {
            background: #ffe3e3;
        }

        .equal {
            background: #228be6;
            color: white;
            grid-column: span 2;
            font-weight: 600;
        }

        .equal:hover {
            background: #1c7ed6;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" value="0" readonly>
    <div class="keys">
        <button class="clear" onclick="clearAll()">C</button>
        <button onclick="deleteLast()">←</button>
        <button class="operator" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">X</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">-</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let resetNext = false;

    function append(val) {
        if (display.value === '0' || display.value === 'Error' || resetNext) {
            if (!['+', '-', '*', '/', '%'].includes(val)) {
                display.value = val;
            } else {
                display.value += val;
            }
            resetNext = false;
            return;
        }

        const lastChar = display.value.slice(-1);
        const operators = ['+', '-', '*', '/', '%'];

        if (operators.includes(lastChar) && operators.includes(val)) {
            display.value = display.value.slice(0, -1) + val;
            return;
        }

        if (val === '.') {
            const parts = display.value.split(/[\+\-\*\/\%]/);
            if (parts[parts.length - 1].includes('.')) return;
        }

        display.value += val;
    }

    function clearAll() {
        display.value = '0';
        resetNext = false;
    }

    function deleteLast() {
        if (display.value === 'Error' || resetNext) {
            clearAll();
            return;
        }
        display.value = display.value.length > 1 ? display.value.slice(0, -1) : '0';
    }

    function calculate() {
        try {
            const expr = display.value.replace(/[^0-9+\-*/.%]/g, '');
            if (!expr) return;
            
            const result = Function(`'use strict'; return (${expr})`)();
            
            if (!Number.isFinite(result)) {
                display.value = 'Error';
            } else {
                display.value = Math.round(result * 1e10) / 1e10;
            }
            resetNext = true;
        } catch {
            display.value = 'Error';
            resetNext = true;
        }
    }
</script>

</body>
</html>
