<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 과제</title>
</head>
<body>
    <script>
        for (let a = 2; a <= 9; a++) {
            document.write("<h1>" + a + "단</h1>");

            for (let b = 1; b <= 9; b++) {
                let q = a * b;
                document.write("<li>" + a + " * " + b + " = " + q + "</li>");
            }
            document.write("<br>"); 
        }
    </script>
</body>
</html>
